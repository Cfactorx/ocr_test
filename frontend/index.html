<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR 文字识别系统——powered by 吕庆新</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drop-area {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .drop-area.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">OCR 文字识别系统——powered by 吕庆新</h1>
            <p class="text-slate-500">上传图片，自动识别文字并提取到编辑框</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Left Column: Upload & Preview -->
            <div class="flex flex-col gap-4">
                <div id="dropZone" class="drop-area rounded-xl p-8 text-center cursor-pointer bg-white shadow-sm hover:shadow-md">
                    <div class="flex flex-col items-center justify-center py-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p class="text-lg font-medium text-slate-700">点击或拖拽图片至此</p>
                        <p class="text-sm text-slate-400 mt-1">支持 JPG, PNG, WebP, PDF</p>
                        <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf">
                    </div
>
                </div>

                <div id="modelSelection" class="bg-white rounded-xl p-4 shadow-sm mb-4">
                    <p class="text-xs font-semibold text-slate-400 uppercase mb-2">选择 OCR 模型</p>
                    <select id="modelSelect" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="gemma4:31b-cloud">Gemma 4 (Default)</option>
                        <option value="llama3.2-vision">Llama 3.2 Vision</option>
                        <option value="llava">LLaVA</option>
                        <option value="bakllava">BakLLaVA</option>
                        <option value="easyocr">EasyOCR</option>
                    </select>
                </div
>
                <div id="previewContainer" class="hidden bg-white rounded-xl p-4 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase mb-2">图片预览</p>
                    <img id="imagePreview" class="w-full h-auto rounded-lg border border-slate-200" src="" alt="Preview">
                    <button id="recognizeBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <span id="btnText">开始识别文字</span>
                        <div id="loader" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </div>
            </div>

            <!-- Right Column: Editor -->
            <div class="flex flex-col gap-4">
                <div class="bg-white rounded-xl p-4 shadow-sm h-full flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-xs font-semibold text-slate-400 uppercase">识别结果 (可编辑)</p>
                        <div class="flex gap-3">
                            <button id="saveLabelBtn" class="text-xs text-green-600 hover:text-green-800 font-medium">保存标注</button>
                            <button id="copyBtn" class="text-xs text-blue-600 hover:text-blue-800 font-medium">复制全部</button>
                        </div>
                    </div>
                    <textarea id="resultText" class="flex-grow w-full p-4 text-slate-700 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none min-h-[400px]" placeholder="等待识别结果..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const recognizeBtn = document.getElementById('recognizeBtn');
        const resultText = document.getElementById('resultText');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        const copyBtn = document.getElementById('copyBtn');
        const saveLabelBtn = document.getElementById('saveLabelBtn');

        let currentFile = null;
        let lastRecognizedData = null;

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        };

        dropZone.ondragleave = () => {
            dropZone.classList.remove('active');
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => {
            handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            if (!file) return;

            const isImage = file.type.startsWith('image/');
            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');

            if (!isImage && !isPdf) {
                alert('请上传有效的图片或 PDF 文件');
                return;
            }

            currentFile = file;

            if (isImage) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                    resultText.value = '';
                    lastRecognizedData = null;
                };
                reader.readAsDataURL(file);
            } else {
                // For PDF, show a PDF icon or generic placeholder since we can't use img src
                imagePreview.src = 'https://cdn-icons-png.flaticon.com/512/337/337946.png';
                previewContainer.classList.remove('hidden');
                resultText.value = '';
                lastRecognizedData = null;
            }
        }

        recognizeBtn.onclick = async () => {
            if (!currentFile) return;

            recognizeBtn.disabled = true;
            loader.classList.remove('hidden');
            btnText.innerText = '识别中...';
            resultText.value = '正在识别文字，请稍候...';

            const formData = new FormData();
            formData.append('file', currentFile);

            const modelSelect = document.getElementById('modelSelect');
            if (modelSelect) {
                formData.append('model', modelSelect.value);
            }

            try {
                const response = await fetch('http://localhost:8080/ocr/recognize', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('OCR 服务响应异常');

                const data = await response.json();
                resultText.value = data.text;
                lastRecognizedData = data; // Save full response including fragments and coordinates
            } catch (err) {
                resultText.value = '识别失败: ' + err.message;
            } finally {
                recognizeBtn.disabled = false;
                loader.classList.add('hidden');
                btnText.innerText = '开始识别文字';
            }
        };

        saveLabelBtn.onclick = async () => {
            if (!currentFile) {
                alert('请先上传图片');
                return;
            }

            const text = resultText.value;
            if (!text) {
                alert('没有可保存的文本内容');
                return;
            }

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('text', text);
            formData.append('original_data', JSON.stringify(lastRecognizedData || {}));
            formData.append('domain', 'general'); // Default domain, can be expanded in future UI

            try {
                const response = await fetch('http://localhost:8080/ocr/save_label', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('保存失败');

                const data = await response.json();
                const labelType = data.type === 'correction' ? '【纠错】' : '【确认正确】';
                alert(`${labelType} 标注已成功保存: ${data.filename}`);
            } catch (err) {
                alert('保存出错: ' + err.message);
            }
        };

        copyBtn.onclick = async () => {
            const text = resultText.value;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    throw new Error('clipboard API unavailable');
                }
            } catch (err) {
                // Fallback: deprecated but works in non-secure contexts
                resultText.select();
                document.execCommand('copy');
            }
            alert('文本已复制到剪贴板');
        };
    </script>
</body>
</html>
